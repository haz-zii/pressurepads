<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pressure — Audiovisual Installation</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080514; font-family: Arial, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; width: min(100vw, 177.7778vh); height: min(56.25vw, 100vh); }
    #controls { position: fixed; z-index: 10; top: 18px; left: 18px; display: flex; gap: 10px; }
    button { border: 1px solid rgba(255,255,255,.55); color: white; background: rgba(15,10,30,.78); padding: 11px 15px; font-size: 12px; letter-spacing: .08em; cursor: pointer; }
    button:hover { background: rgba(80,45,120,.9); }
    #status { position: fixed; z-index: 10; right: 18px; top: 20px; color: rgba(255,255,255,.7); font-size: 11px; letter-spacing: .12em; }
    body.projector #controls, body.projector #status { opacity: 0; transition: opacity .4s; }
    body.projector:hover #controls, body.projector:hover #status { opacity: 1; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="audio.js"></script>
</head>
<body>
  <div id="controls">
    <button id="connectButton">CONNECT ARDUINO</button>
    <button id="fullscreenButton">FULL SCREEN</button>
  </div>
  <div id="status">ARDUINO: DISCONNECTED</div>
  <script src="sketch.js"></script>
</body>
</html>
